name: Validate and publish cranebench to PyPI

on:
  push:
    tags:
      - 'v0.1.2'

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            profile: minimum
          - os: windows-latest
            python: '3.10'
            profile: minimum
          - os: ubuntu-latest
            python: '3.14'
            profile: revision
          - os: windows-latest
            python: '3.14'
            profile: revision
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and testing dependencies
        run: python -m pip install -c ci/${{ matrix.profile }}.txt ".[dev]" pytest-cov
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Record artifact checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          files = sorted(Path('dist').glob('*'))
          assert len(files) == 2, f'Expected wheel and sdist, found {len(files)} files'
          checksums = Path('release-checksums')
          checksums.mkdir()
          (checksums / 'SHA256SUMS.txt').write_text(''.join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in files), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dists
          path: |
            dist/*
            release-checksums/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish to production PyPI
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cranebench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dists
          path: .
      - name: Verify artifact checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          folder = Path('dist')
          lines = Path('release-checksums/SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          assert len(lines) == 2, 'Expected checksums for exactly two distributions'
          for line in lines:
              expected, filename = line.split('  ', 1)
              assert hashlib.sha256((folder / filename).read_bytes()).hexdigest() == expected
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/