[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cranebench"
version = "0.1.0"
description = "A reproducible benchmark for underactuated crane control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "O. Sheremet" }, { name = "S. Podliesnyi" }]
keywords = ["crane", "underactuated", "benchmark", "reproducibility",
            "sliding mode control", "Monte Carlo"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.6", "sympy>=1.12"]

[tool.setuptools.packages.find]
include = ["cranebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
